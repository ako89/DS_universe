<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DS Universe — a map of the data science algorithm space</title>
    <meta
      name="description"
      content="An explorable map of the data science algorithm universe, from linear regression to large language models."
    />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/overlay.css" />
    <link rel="stylesheet" href="/src/styles/card.css" />
  </head>
  <body>
    <!--
      The canvas is the scene. Everything else is an HTML overlay positioned on top of it.
      Body labels live in #overlay (see docs/ENGINE_SPEC.md §4.2 — labels are HTML, never
      ctx.fillText, so they stay crisp at any DPR and reach the accessibility tree).
    -->
    <canvas id="scene" aria-hidden="true"></canvas>

    <!--
      Shown until main.ts renders its first frame, and repurposed as a fatal-error message if
      setup throws before then (see main.ts's error boundary) — the canvas and every other
      element above are otherwise silent and empty until JS runs, which reads as broken rather
      than loading. Inline styles rather than main.css: this must render the instant the HTML
      parses, before the stylesheet (or the module script) has necessarily loaded.
    -->
    <div
      id="loading"
      role="status"
      style="
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05060d;
        color: #a8adc0;
        font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
      "
    >
      Loading DS Universe…
    </div>

    <!-- Text alternative to the canvas for screen readers: a one-time overview of the map. -->
    <div id="a11y-summary" class="visually-hidden" role="region" aria-label="Map contents"></div>

    <!-- Announces whatever's currently hovered/keyboard-focused — the canvas has no DOM presence
         of its own for a screen reader to read, see ui/a11y-status.ts. -->
    <div id="a11y-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <div id="overlay"></div>
    <div id="card" role="complementary" aria-label="Algorithm detail"></div>
    <div id="modal" role="dialog" aria-modal="true" aria-label="Search and advisor" hidden></div>
    <div id="help" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" hidden></div>

    <noscript>
      <p style="color: #e6e8f0; font: 16px/1.6 system-ui; padding: 2rem; max-width: 60ch">
        DS Universe is an interactive map and needs JavaScript to run. The underlying content —
        every algorithm, its explanation and its references — lives in
        <code>src/content/bodies/</code> in the repository if you would rather read the source.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
